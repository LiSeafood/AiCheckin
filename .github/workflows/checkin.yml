name: Daily Checkin

on:
  schedule:
    # 北京时间 09:05 = UTC 01:05
    - cron: "5 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Token health check
        env:
          WORKBUDDY_ACCESS_TOKEN: ${{ secrets.WORKBUDDY_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, checkin
          checkin.report_token_health("WorkBuddy", os.environ.get("WORKBUDDY_ACCESS_TOKEN"))
          PY

      - name: Run checkin
        env:
          WORKBUDDY_ACCESS_TOKEN: ${{ secrets.WORKBUDDY_ACCESS_TOKEN }}
          WORKBUDDY_UID: ${{ secrets.WORKBUDDY_UID }}
          WORKBUDDY_DOMAIN: ${{ secrets.WORKBUDDY_DOMAIN }}
        run: python checkin.py

      # Trae 云端模式:如需在 Actions 里也签 Trae,配置 TRAE_TOKEN / TRAE_REGION
      # 两个 Secret 并取消下面的注释(云端 token 无法自动续期,需定期手动更新)。
      # - name: Run checkin (with Trae)
      #   env:
      #     WORKBUDDY_ACCESS_TOKEN: ${{ secrets.WORKBUDDY_ACCESS_TOKEN }}
      #     WORKBUDDY_UID: ${{ secrets.WORKBUDDY_UID }}
      #     WORKBUDDY_DOMAIN: ${{ secrets.WORKBUDDY_DOMAIN }}
      #     TRAE_TOKEN: ${{ secrets.TRAE_TOKEN }}
      #     TRAE_REGION: ${{ secrets.TRAE_REGION }}
      #   run: python checkin.py
